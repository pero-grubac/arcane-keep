name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Nothing in these ends up in dist/, so there is nothing to rebuild.
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer push makes this build pointless, so drop it.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A broken build should never reach Pages.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # enablement turns Pages on via the API if it has never been enabled, so a
      # fresh clone or fork deploys without anyone visiting Settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Never cancel a deploy halfway; queue at most one more behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
