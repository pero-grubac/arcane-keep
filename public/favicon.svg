<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Arcane Keep">
  <title>Arcane Keep</title>

  <defs>
    <!-- Warm stone gradient so the keep reads as lit from above. -->
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d98d"/>
      <stop offset="0.5" stop-color="#d4a853"/>
      <stop offset="1" stop-color="#a07a35"/>
    </linearGradient>
    <!-- The arcane part of Arcane Keep. -->
    <radialGradient id="rune" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdf2ff"/>
      <stop offset="0.5" stop-color="#4bb8f0"/>
      <stop offset="1" stop-color="#4bb8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark plate: keeps the silhouette legible on light and dark tab bars alike.
       Deliberately thin-bordered — at 16px every spare pixel goes to the keep. -->
  <rect width="32" height="32" rx="6.5" fill="#0d0c16"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="5.9"
        fill="none" stroke="#d4a853" stroke-opacity="0.32" stroke-width="1.2"/>

  <circle cx="16" cy="16" r="10" fill="url(#rune)" opacity="0.3"/>

  <!-- Battlements: three merlons, symmetrical about x=16. Gaps are kept at
       2.5 units so they survive being scaled down to a 16px tab icon. -->
  <path fill="url(#stone)" d="
    M6 4.5h5v5H6z
    M13.5 4.5h5v5h-5z
    M21 4.5h5v5h-5z
  "/>

  <!-- Keep body and plinth. -->
  <path fill="url(#stone)" d="M6 8.5h20v16H6z"/>
  <rect x="3" y="24" width="26" height="4.5" rx="1.2" fill="url(#stone)"/>

  <!-- Arcane window: large enough to still be a shape at 16px, not a dot. -->
  <path fill="#0d0c16" d="M16 10.4l4.4 5.9-4.4 5.9-4.4-5.9z"/>
  <path fill="#8fe0ff" d="M16 12.7l2.6 3.6-2.6 3.6-2.6-3.6z"/>
</svg>
